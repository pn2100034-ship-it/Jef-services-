<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087b49"><title>JËF SERVICE</title>
<style>
:root{--g:#087b49;--mint:#eaf6ef;--ink:#17251e;--muted:#65736b;--line:#e1ebe5}*{box-sizing:border-box}body{margin:0;background:#f4f8f5;color:var(--ink);font:15px system-ui,Arial}header{background:#111b1b;color:white;padding:15px;display:flex;justify-content:space-between;position:sticky;top:0}.brand{font-weight:850;font-size:18px}.user{font-size:12px;color:#d8e7df}main{max-width:760px;margin:auto;padding:14px 14px 90px}.hero{background:linear-gradient(125deg,#18372d,#087b49);color:white;border-radius:22px;padding:22px 18px;margin-bottom:14px;min-height:150px}.hero h1{font-size:24px;line-height:1.2;margin:12px 0}.hero p{font-size:14px;line-height:1.5;color:#e6f3eb}.tag,.pill{display:inline-block;border-radius:20px;padding:5px 9px;background:#e7f5ec;color:#267447;font-size:11px;font-weight:700}.tag{background:#ffffff24;color:white}.search{display:flex;gap:8px;background:white;border:1px solid var(--line);border-radius:14px;padding:11px;margin:14px 0}.search input{border:0;outline:0;width:100%;font:inherit}.head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 12px}.head h2{font-size:18px;margin:0}.head button{background:none;color:var(--g);padding:4px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.panel,.item{background:white;border:1px solid var(--line);border-radius:17px;padding:13px;min-width:0}.emoji{font-size:23px;background:var(--mint);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:9px}.card h3,.item h3{font-size:14px;margin:7px 0}.card p,.item p,.muted{font-size:12px;color:var(--muted);line-height:1.45}.price{font-weight:850;color:var(--g);margin:9px 0}button{border:0;border-radius:11px;padding:10px 12px;background:var(--g);color:white;font-weight:750;font-size:13px;cursor:pointer}.card button{width:100%}.secondary{background:var(--mint);color:var(--g)}.full{width:100%}.bottom{position:fixed;bottom:0;left:0;right:0;background:#111b1b;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:5}.bottom button{background:transparent;color:#d9e6df;font-size:10px;padding:7px 2px;display:flex;flex-direction:column;gap:3px}.bottom button.active{background:var(--g)}.ico{font-size:19px}label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}textarea{min-height:75px}.empty{text-align:center;color:var(--muted);padding:25px}.stat{background:var(--mint);padding:12px;border-radius:12px;flex:1}.stat b{display:block;color:var(--g);font-size:20px}@media(max-width:440px){.cards{grid-template-columns:1fr 1fr}.card{padding:11px}.card p{min-height:48px}}
</style></head><body>
<header><div class="brand">JËF SERVICE 🇸🇳</div><div class="user" id="userhead">Bienvenue</div></header><main id="app"></main>
<nav class="bottom"><button data-tab="home" class="active"><span class="ico">⌂</span>Accueil</button><button data-tab="services"><span class="ico">▦</span>Services</button><button data-tab="orders"><span class="ico">▤</span>Commandes</button><button data-tab="messages"><span class="ico">✉</span>Messages</button><button data-tab="profile"><span class="ico">♙</span>Profil</button></nav>
<script>
const K='jef_service_redesign_v2',S=[['cv','📄','Rédaction','Création de CV professionnel','CV moderne livré en PDF.',5000],['logo','🎨','Design','Création de logo','Logo pro et identité visuelle.',7500],['video','🎬','Vidéo','Montage vidéo','Montage soigné de vos vidéos.',10000],['trad','🌍','Traduction','Traduction français-wolof','Traduction claire et fidèle.',3000],['assist','💻','Assistance','Assistance numérique','Aide pour vos tâches numériques.',4000],['social','📱','Communication','Gestion des réseaux sociaux','Aide à la gestion de vos pages.',12000]];
let d=JSON.parse(localStorage.getItem(K)||'null')||{name:'',role:'Client',skills:'',orders:[]},tab='home',q='';const app=document.getElementById('app'),fmt=n=>Number(n).toLocaleString('fr-FR')+' FCFA';function save(){localStorage.setItem(K,JSON.stringify(d))}
function card(s){return `<article class="card"><div class="emoji">${s[1]}</div><span class="pill">${s[2]}</span><h3>${s[3]}</h3><p>${s[4]}</p><div class="price">${fmt(s[5])}</div><button onclick="order('${s[0]}')">Commander →</button></article>`}
function go(t){tab=t;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function render(){document.getElementById('userhead').textContent=d.name||'Bienvenue';
if(tab==='home'||tab==='services'){let a=S.filter(s=>(s[3]+s[2]).toLowerCase().includes(q.toLowerCase()));app.innerHTML=`<section class="hero"><span class="tag">🇸🇳 Plateforme sénégalaise</span><h1>Tes services en quelques clics</h1><p>Une plateforme pour trouver des prestataires et commander des services en ligne.</p></section><div class="search">⌕ <input id="q" placeholder="Rechercher un service · Ex. CV, logo, vidéo..." value="${q}"></div><div class="head"><h2>${tab==='home'?'Services populaires':'Tous les services'}</h2><button onclick="go('services')">Voir tout ›</button></div><div class="cards">${a.map(card).join('')||'<p>Aucun service trouvé.</p>'}</div>`;document.getElementById('q').oninput=e=>{q=e.target.value;render();let x=document.getElementById('q');x.focus();x.setSelectionRange(q.length,q.length)}} 
else if(tab==='orders'){app.innerHTML=`<div class="head"><h2>Mes commandes</h2></div>${d.orders.length?d.orders.map(o=>`<div class="item"><h3>${o.title}</h3><p>${o.date} · ${fmt(o.price)}</p><p>Statut : ${o.status}</p></div>`).join(''):'<div class="panel empty">Aucune commande pour le moment.</div>'}`}
else if(tab==='messages'){app.innerHTML=`<div class="head"><h2>Messages</h2></div><div class="panel"><p>La messagerie sera activée lorsque la plateforme disposera d'une base de données et d'une connexion sécurisée.</p><p class="muted">Cette fonction n'envoie pas encore de messages.</p></div>`}
else if(tab==='profile'){app.innerHTML=`<div class="head"><h2>Profil et compte</h2></div><div class="panel"><label>Nom affiché</label><input id="name" value="${d.name}" placeholder="Ton nom"><label>Type de compte</label><select id="role"><option ${d.role==='Client'?'selected':''}>Client</option><option ${d.role==='Prestataire'?'selected':''}>Prestataire</option></select><label>Compétences</label><textarea id="skills" placeholder="Ex. CV, logo, vidéo">${d.skills}</textarea><button class="full" onclick="profileSave()">Enregistrer mon profil</button></div><div class="panel"><b>Commission JËF SERVICE : 10 %</b><p class="muted">Part prévue : 90 % prestataire et 10 % plateforme. Le paiement partagé automatique reste à connecter.</p><button class="secondary full" onclick="go('provider')">Ouvrir l'espace prestataire</button></div>`}
else if(tab==='provider'){let avail=d.orders.filter(o=>o.status==='En attente'),mine=d.orders.filter(o=>o.provider);app.innerHTML=`<div class="head"><h2>Espace prestataire</h2><span class="pill">Commission 10 %</span></div><div class="panel"><p>Consulte les demandes et accepte les missions correspondant à tes compétences.</p><div style="display:flex;gap:8px"><div class="stat"><b>90 %</b><span class="muted">Prestataire</span></div><div class="stat"><b>10 %</b><span class="muted">JËF SERVICE</span></div></div></div><h3>Missions disponibles</h3>${avail.length?avail.map(o=>`<div class="item"><h3>${o.title}</h3><p>${fmt(o.price)} · Part prévue : ${fmt(o.price*.9)}</p><button onclick="accept(${o.id})">Accepter la mission</button></div>`).join(''):'<div class="panel empty">Aucune mission disponible.</div>'}<h3>Mes missions</h3>${mine.map(o=>`<div class="item"><h3>${o.title}</h3><p>${o.status}</p></div>`).join('')||'<div class="panel empty">Aucune mission acceptée.</div>'}`}
}
function order(id){let s=S.find(x=>x[0]===id);if(!d.name){alert('Enregistre ton nom dans Profil avant de commander.');go('profile');return}if(!confirm('Confirmer '+s[3]+' au prix de '+fmt(s[5])+' ?'))return;d.orders.unshift({id:Date.now(),title:s[3],price:s[5],status:'En attente',date:new Date().toLocaleDateString('fr-FR'),provider:false});save();alert('Commande de démonstration créée. Aucun paiement réel effectué.');go('orders')}
function profileSave(){d.name=document.getElementById('name').value.trim();d.role=document.getElementById('role').value;d.skills=document.getElementById('skills').value;save();alert('Profil enregistré sur cet appareil.');go(d.role==='Prestataire'?'provider':'profile')}
function accept(id){let o=d.orders.find(x=>x.id===id);if(o){o.provider=true;o.status='Acceptée par le prestataire';save();render()}}
render();
</script></body></html>
